name: android

# No Gradle wrapper jar is committed, so CI uses a provisioned Gradle whose version must
# match distributionUrl in android/gradle/wrapper/gradle-wrapper.properties (8.7).

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wristfeed-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
