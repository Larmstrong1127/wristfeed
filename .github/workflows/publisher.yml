name: publisher

on:
  push:
    paths: ["publisher/**", "conformance/**", "SPEC.md", "examples/**", ".github/workflows/publisher.yml"]
  pull_request:
    paths: ["publisher/**", "conformance/**", "SPEC.md", "examples/**", ".github/workflows/publisher.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: Validate example feeds
        run: for f in ../examples/*.json; do wristfeed validate "$f"; done
